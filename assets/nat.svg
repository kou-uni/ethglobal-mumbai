<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" width="1680" height="1180" font-family="Figtree, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1b1630"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f2600c"/></marker>
  </defs>
  <style>
    .card{fill:#fff;stroke:#1b1630;stroke-width:2.5}
    .h{font-size:21px;font-weight:600;fill:#1b1630}
    .k{font-size:14px;font-weight:600;letter-spacing:.08em;fill:#8b8498}
    .t{font-size:17px;fill:#4a4357}
    .m{font-size:16px;fill:#4a4357}
    .key{font-size:16px;fill:#8f1d14;font-weight:600}
    .ttl{font-size:30px;font-weight:600;fill:#1b1630}
    .sub{font-size:19px;fill:#6b6478}
    .num{font-size:16px;font-weight:600;fill:#fff}
    .lab{font-size:16px;fill:#1b1630}
    .note{font-size:15px;fill:#8f1d14}
</style>
  <rect width="1680" height="1180" fill="#F3EEE6"/>

<text class="ttl" x="60" y="54">TOMOSHIBI is NAT for API keys</text>
<text class="sub" x="60" y="88">The tools speak in labels. The real key exists on the far side of one table, and crossing it is the only thing a person is asked about.</text>
<rect x="560" y="130" width="700" height="112" rx="16" fill="#FFF4EA" stroke="#f2600c" stroke-width="2.5"/>
<text class="k" x="584" y="164" fill="#c2410c">THE LEDGER · plugged into the same laptop</text>
<text class="t" x="584" y="196">The only thing that can add a row,</text>
<text class="t" x="584" y="222">and the only thing that can approve a heavy crossing.</text>
<path d="M910 242 L910 286" stroke="#f2600c" stroke-width="2.5" marker-end="url(#af)"/>
<text class="k" x="60" y="320">INSIDE · ONE LAPTOP</text>
<rect class="card" x="60" y="340" width="340" height="88" rx="14"/>
<text class="h" x="84" y="376">an agent + its skills</text>
<text class="m" x="84" y="406">asks with: stripe-live</text>
<path d="M400 384 L476 384" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="60" y="450" width="340" height="88" rx="14"/>
<text class="h" x="84" y="486">a tool you wrote</text>
<text class="m" x="84" y="516">asks with: gh-readonly</text>
<path d="M400 494 L476 494" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="60" y="560" width="340" height="88" rx="14"/>
<text class="h" x="84" y="596">a tool someone else wrote</text>
<text class="m" x="84" y="626">asks with: resend-tx</text>
<path d="M400 604 L476 604" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="480" y="286" width="860" height="382" rx="18" fill="#fffdf8"/>
<text class="h" x="504" y="324">TOMOSHIBI · the table, and the crossing</text>
<text class="k" x="504" y="368">LABEL</text>
<text class="k" x="700" y="368">WHAT IT MAY DO</text>
<text class="k" x="1150" y="368">THE REAL KEY</text>
<path d="M504 382 L1316 382" stroke="#d8d2c6" stroke-width="2"/>
<text class="lab" x="504" y="418">stripe-live</text>
<text class="m" x="700" y="418">api.stripe.com · * /v1 · 20 calls · 7 days</text>
<text class="key" x="1150" y="418">sk_live_••••</text>
<text class="lab" x="504" y="470">gh-readonly</text>
<text class="m" x="700" y="470">api.github.com · GET /repos · 200 calls</text>
<text class="key" x="1150" y="470">ghp_••••</text>
<text class="lab" x="504" y="522">resend-tx</text>
<text class="m" x="700" y="522">api.resend.com · POST /emails · 50 calls</text>
<text class="key" x="1150" y="522">re_••••</text>
<path d="M1120 392 L1120 594" stroke="#8f1d14" stroke-width="2.5" stroke-dasharray="7 6"/>
<text class="note" x="504" y="624">The right column is never printed, never logged, never returned to a tool, and never shown on a screen.</text>
<text class="k" x="1400" y="320">OUTSIDE · THE REAL SERVICES</text>
<rect class="card" x="1400" y="340" width="220" height="88" rx="14"/>
<text class="lab" x="1424" y="392">api.stripe.com</text>
<path d="M1340 384 L1396 384" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="1400" y="450" width="220" height="88" rx="14"/>
<text class="lab" x="1424" y="502">api.github.com</text>
<path d="M1340 494 L1396 494" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="1400" y="560" width="220" height="88" rx="14"/>
<text class="lab" x="1424" y="612">api.resend.com</text>
<path d="M1340 604 L1396 604" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<text class="k" x="60" y="740">The analogy, line by line</text>
<rect class="card" x="60" y="760" width="860" height="364" rx="16" fill="#fffdf8"/>
<text class="k" x="84" y="794">NAT</text>
<text class="k" x="470" y="794">TOMOSHIBI</text>
<path d="M84 808 L896 808" stroke="#d8d2c6" stroke-width="2"/>
<text class="m" x="84" y="842">a private address, 10.x</text>
<text class="m" x="470" y="842">a label — meaningless anywhere else</text>
<text class="m" x="84" y="882">the public address</text>
<text class="m" x="470" y="882">the real API key</text>
<text class="m" x="84" y="922">the NAT box</text>
<text class="m" x="470" y="922">the Broker, on the laptop</text>
<text class="m" x="84" y="962">the translation table</text>
<text class="m" x="470" y="962">label → range → secret</text>
<text class="m" x="84" y="1002">the firewall rules</text>
<text class="m" x="470" y="1002">the signed permit: target, operation, count, expiry</text>
<text class="m" x="84" y="1042">nothing gets in by itself</text>
<text class="m" x="470" y="1042">no label works without a signature that is still good</text>
<text class="m" x="84" y="1082">the administrator</text>
<text class="m" x="470" y="1082">the Ledger. Not a password, and not the agent</text>
<text class="k" x="960" y="740">Who it is for</text>
<rect x="960" y="760" width="660" height="364" rx="16" fill="#fffdf8" stroke="#1b1630" stroke-width="2.5" stroke-dasharray="8 7"/>
<text class="t" x="984" y="806">Someone who builds with APIs and runs a dozen keys at once:</text>
<text class="t" x="984" y="840">their own tools, other people's tools, and an agent that calls both.</text>
<text class="t" x="984" y="874">Today those keys sit in .env files, in chat history and in CI secrets,</text>
<text class="t" x="984" y="908">each one good for everything, forever. One table replaces all of it,</text>
<text class="t" x="984" y="942">and the only thing that interrupts the work is the heavy crossing.</text>
</svg>