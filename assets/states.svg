<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" width="1680" height="1000" font-family="Figtree, Helvetica, Arial, sans-serif">
  <title>TOMOSHIBI — the states one attempt can end in</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1b1630"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f2600c"/></marker>
  </defs>
  <style>
    .bx{fill:#fff;stroke:#1b1630;stroke-width:2.5}
    .end{fill:#fff;stroke:#8f1d14;stroke-width:2.5}
    .ok{fill:#ffd0ad;stroke:#1b1630;stroke-width:2.5}
    .h{font-size:20px;font-weight:700;fill:#1b1630}
    .e{font-size:20px;font-weight:700;fill:#8f1d14}
    .t{font-size:16px;fill:#4a4357}
    .ttl{font-size:30px;font-weight:700;fill:#1b1630}
    .sub{font-size:19px;fill:#6b6478}
    .band{font-size:16px;font-weight:700;letter-spacing:.09em;fill:#6b6478}
    .lb{font-size:15px;fill:#4a4357}
  </style>
  <rect width="1680" height="1000" fill="#F3EEE6"/>
  <text class="ttl" x="60" y="54">TOMOSHIBI — what one attempt can end as</text>
  <text class="sub" x="60" y="86">Nothing is held open. Every gate is a terminal answer, and a press is a new attempt, not a resumed one.</text>

  <text class="band" x="60" y="140">ONE ATTEMPT · POST /use</text>
  <rect class="bx" x="60" y="160" width="190" height="78" rx="12"/>
  <text class="h" x="80" y="196">RECEIVED</text><text class="t" x="80" y="222">permit + 2 signatures</text>

  <rect class="bx" x="300" y="160" width="190" height="78" rx="12"/>
  <text class="h" x="320" y="196">scope check</text><text class="t" x="320" y="222">no side effects</text>

  <rect class="bx" x="540" y="160" width="190" height="78" rx="12"/>
  <text class="h" x="560" y="196">weigh at 0G</text><text class="t" x="560" y="222">three tiers, body read</text>

  <rect class="bx" x="780" y="160" width="190" height="78" rx="12"/>
  <text class="h" x="800" y="196">press needed?</text><text class="t" x="800" y="222">tier ≥ ZG_ESCALATE</text>

  <rect class="bx" x="1020" y="160" width="190" height="78" rx="12"/>
  <text class="h" x="1040" y="196">reserve</text><text class="t" x="1040" y="222">one call of maxCalls</text>

  <rect class="bx" x="1260" y="160" width="160" height="78" rx="12"/>
  <text class="h" x="1280" y="196">execute</text><text class="t" x="1280" y="222">key goes in here</text>

  <rect class="ok" x="1470" y="160" width="150" height="78" rx="12"/>
  <text class="h" x="1490" y="196">ALLOWED</text><text class="t" x="1490" y="222">remaining n</text>

  <path d="M250 199 L296 199" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M490 199 L536 199" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M730 199 L776 199" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M970 199 L1016 199" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1210 199 L1256 199" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1420 199 L1466 199" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>

  <path d="M395 238 L395 300" stroke="#8f1d14" stroke-width="2.5" marker-end="url(#a)"/>
  <rect class="end" x="300" y="300" width="190" height="104" rx="12"/>
  <text class="e" x="320" y="336">DENIED</text>
  <text class="t" x="320" y="362">bad signature · expired</text>
  <text class="t" x="320" y="384">wrong key · not https</text>

  <path d="M635 238 L635 300" stroke="#8f1d14" stroke-width="2.5" marker-end="url(#a)"/>
  <rect class="end" x="540" y="300" width="190" height="104" rx="12"/>
  <text class="e" x="560" y="336">STOPPED</text>
  <text class="t" x="560" y="362">0G unreachable, or an</text>
  <text class="t" x="560" y="384">answer that cannot be read</text>

  <path d="M875 238 L875 300" stroke="#f2600c" stroke-width="2.5" marker-end="url(#af)"/>
  <rect class="end" x="780" y="300" width="190" height="104" rx="12" stroke="#f2600c"/>
  <text class="e" x="800" y="336" fill="#c2410c">NEEDS_PRESS</text>
  <text class="t" x="800" y="362">the four lines go back</text>
  <text class="t" x="800" y="384">with them</text>

  <path d="M1115 238 L1115 300" stroke="#8f1d14" stroke-width="2.5" marker-end="url(#a)"/>
  <rect class="end" x="1020" y="300" width="190" height="104" rx="12"/>
  <text class="e" x="1040" y="336">DENIED</text>
  <text class="t" x="1040" y="362">EXHAUSTED —</text>
  <text class="t" x="1040" y="384">the count is used up</text>

  <path d="M875 404 L875 432 L155 432 L155 242" stroke="#f2600c" stroke-width="2.5" fill="none" marker-end="url(#af)"/>
  <text class="lb" x="200" y="424" fill="#8f1d14">a press makes a NEW attempt: the same request on a permit with maxCalls = 1 — every gate runs again, 0G included</text>

  <text class="band" x="60" y="470">WHAT SURVIVES AN ATTEMPT · data/ledger.jsonl, append only</text>
  <rect class="bx" x="60" y="490" width="760" height="190" rx="14" fill="#fffdf8"/>
  <text class="t" x="84" y="524">Every one of the six states above is appended as a record. Nothing is ever removed,</text>
  <text class="t" x="84" y="548">and on start-up the file is re-read, so a restart cannot return a spent call.</text>
  <text class="h" x="84" y="586">counts</text><text class="t" x="200" y="586">holder:nonce → calls spent</text>
  <text class="h" x="84" y="614">owners</text><text class="t" x="200" y="614">holder:nonce → which skill (only if the signature checked out)</text>
  <text class="h" x="84" y="642">byHolder</text><text class="t" x="200" y="642">holder → everything about that person's key, in order</text>
  <text class="h" x="84" y="670">stars/checked</text><text class="t" x="240" y="670">skill:version → who lit it · how many were owner-checked</text>

  <text class="band" x="880" y="470">AFTERWARDS</text>
  <rect class="bx" x="880" y="490" width="330" height="86" rx="12"/>
  <text class="h" x="904" y="524">SEALED</text>
  <text class="t" x="904" y="552">POST /seal → one thread into 0G Storage</text>
  <rect class="bx" x="880" y="600" width="330" height="80" rx="12"/>
  <text class="t" x="904" y="632">the morning page reads the file:</text>
  <text class="t" x="904" y="658">stopped · pressed · passed</text>

  <text class="band" x="1260" y="470">A SEPARATE MACHINE · POST /vouch</text>
  <rect class="bx" x="1260" y="490" width="360" height="190" rx="14" fill="#fffdf8"/>
  <text class="t" x="1284" y="524">owner check first — the holder signed it,</text>
  <text class="t" x="1284" y="548">and it was really used at least once</text>
  <text class="e" x="1284" y="586">VOUCH_DENIED</text>
  <text class="t" x="1284" y="610">NOT_OWNER · NOT_USED — World is never asked</text>
  <text class="h" x="1284" y="648">STAR</text>
  <text class="t" x="1284" y="672">one person, once, per version</text>

  <rect x="60" y="740" width="1560" height="200" rx="18" fill="#fffdf8" stroke="#1b1630" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text class="band" x="84" y="778">THE PROCESSES THESE RUN IN · tools/demo-up.sh, one machine</text>
  <text class="t" x="84" y="814">Broker 8797 — holds the key · EXECUTE=0 and SECRETS unset while filming</text>
  <text class="t" x="84" y="842">Broker deafened 8798 — ZG_ENDPOINT points nowhere, so STOPPED can be shown on stage</text>
  <text class="t" x="84" y="870">Bridge 8791 — 127.0.0.1 only. The tool reaches the device through it. The Broker never does</text>
  <text class="t" x="84" y="898">The tool 8792 — holds a label, a range and a count</text>
  <text class="t" x="84" y="926">Pages 8790 — web/ · the Broker alone listens on 8787</text>
</svg>
