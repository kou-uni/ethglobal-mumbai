<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1420" width="1680" height="1420" font-family="Figtree, Helvetica, Arial, sans-serif">
  <title>TOMOSHIBI — one request, end to end</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1b1630"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#f2600c"/></marker>
  </defs>
  <style>
    .bx{fill:#fff;stroke:#1b1630;stroke-width:2.5}
    .h{font-size:21px;font-weight:700;fill:#1b1630;letter-spacing:.04em}
    .t{font-size:19px;fill:#4a4357}
    .st{font-size:21px;font-weight:700;fill:#1b1630}
    .num{font-size:17px;font-weight:700;fill:#fff}
    .lb{font-size:17px;fill:#4a4357}
    .chip{font-size:16px;font-weight:700;fill:#8f1d14;letter-spacing:.04em}
    .ttl{font-size:30px;font-weight:700;fill:#1b1630}
    .sub{font-size:19px;fill:#6b6478}
    .zone{font-size:20px;font-weight:700;letter-spacing:.1em}
    .zsub{font-size:17px;fill:#6b6478}
  </style>
  <rect width="1680" height="1420" fill="#F3EEE6"/>
  <text class="ttl" x="60" y="56">TOMOSHIBI — one request, end to end</text>
  <text class="sub" x="60" y="88">The key is held in one place. The agent is given a label, a range, and a count.</text>

  <!-- where each thing runs -->
  <rect x="40" y="120" width="390" height="220" rx="20" fill="#FFF4EA" stroke="#f2600c" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="zone" x="60" y="152" fill="#8f1d14">IN HER HAND</text>
  <rect x="40" y="370" width="1210" height="820" rx="20" fill="#ECE5D8" stroke="#1b1630" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="zone" x="1226" y="398" text-anchor="end" fill="#1b1630">ON HER COMPUTER</text>
  <text class="zsub" x="1226" y="422" text-anchor="end">today one machine · in production the Broker moves into a TEE (POSITION.md, A2)</text>
  <rect x="1290" y="560" width="350" height="640" rx="20" fill="#E7E3EE" stroke="#6b6478" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="zone" x="1310" y="594" fill="#4a4357">OUTSIDE</text>

  <!-- the broker -->
  <rect class="bx" x="470" y="430" width="760" height="740" rx="18" fill="#fffdf8"/>
  <text class="h" x="494" y="472">THE BROKER — the only thing that holds the key</text>
  <rect class="bx" x="510" y="500" width="680" height="80" rx="10" fill="#F3EEE6"/>
  <text class="st" x="534" y="532">1 · Scope check</text>
  <text class="t" x="534" y="560">signature · expiry · count · target · scope</text>
  <text class="chip" x="1166" y="546" text-anchor="end">REFUSED, AND RECORDED</text>
  <rect class="bx" x="510" y="610" width="680" height="80" rx="10" fill="#F3EEE6"/>
  <text class="st" x="534" y="642">2 · How heavy is this?</text>
  <text class="t" x="534" y="670">the only step that reads the body</text>
  <text class="chip" x="1166" y="656" text-anchor="end">NO ANSWER → STOPPED</text>
  <rect class="bx" x="510" y="720" width="680" height="80" rx="10" fill="#F3EEE6"/>
  <text class="st" x="534" y="752">3 · Does a person have to press?</text>
  <text class="t" x="534" y="780">heavy, or money moving</text>
  <text class="chip" x="1166" y="766" text-anchor="end">NEEDS A PRESS</text>
  <rect class="bx" x="510" y="830" width="680" height="80" rx="10" fill="#F3EEE6"/>
  <text class="st" x="534" y="862">4 · Reserve one call of the count</text>
  <text class="t" x="534" y="890">nothing runs between the check and the write</text>
  <rect class="bx" x="510" y="940" width="680" height="80" rx="10" fill="#ffd0ad"/>
  <text class="st" x="534" y="972">5 · Put the key in, and send it</text>
  <text class="t" x="534" y="1000">the secret exists only in this moment</text>
  <rect class="bx" x="510" y="1060" width="680" height="96" rx="10" fill="#F3EEE6"/>
  <text class="st" x="534" y="1092">6 · The trail</text>
  <text class="t" x="534" y="1120">append-only · allowed and refused in one place</text>
  <text class="t" x="534" y="1145">carries the signature of whatever tried it</text>

  <!-- her side -->
  <rect class="bx" x="60" y="170" width="330" height="150" rx="18"/>
  <text class="h" x="84" y="212">THE LEDGER</text>
  <text class="t" x="84" y="244">a device of her own</text>
  <text class="t" x="84" y="272">signs the permit</text>
  <text class="t" x="84" y="300">holds the button</text>

  <rect class="bx" x="60" y="560" width="330" height="150" rx="18"/>
  <text class="h" x="84" y="602">AGENT + SKILL</text>
  <text class="t" x="84" y="634">holds the permit, the</text>
  <text class="t" x="84" y="662">signature and a label</text>
  <text class="t" x="84" y="690">— never the key</text>

  <rect class="bx" x="60" y="800" width="330" height="110" rx="18" fill="#ffd0ad"/>
  <text class="h" x="84" y="842">THE KEYS</text>
  <text class="t" x="84" y="874">kept only here</text>

  <rect class="bx" x="60" y="1000" width="330" height="120" rx="18"/>
  <text class="h" x="84" y="1042">THE MORNING PAGE</text>
  <text class="t" x="84" y="1074">stopped · pressed · passed</text>

  <!-- outside -->
  <rect class="bx" x="1310" y="620" width="310" height="130" rx="18" fill="#fffdf8"/>
  <text class="h" x="1334" y="662">0G PRIVATE COMPUTER</text>
  <text class="t" x="1334" y="694">reads it once, answers</text>
  <text class="t" x="1334" y="722">routine / decisive / heavy</text>

  <rect class="bx" x="1310" y="940" width="310" height="100" rx="18"/>
  <text class="h" x="1334" y="982">THE REAL API</text>
  <text class="t" x="1334" y="1014">Stripe, and others</text>

  <rect class="bx" x="1310" y="1060" width="310" height="120" rx="18" fill="#fffdf8"/>
  <text class="h" x="1334" y="1102">0G STORAGE</text>
  <text class="t" x="1334" y="1134">the thread, sealed</text>
  <text class="t" x="1334" y="1160">root hash + tx</text>

  <!-- the order -->
  <path d="M225 324 L225 556" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <circle cx="225" cy="440" r="17" fill="#1b1630"/><text class="num" x="225" y="446" text-anchor="middle">1</text>
  <text class="lb" x="250" y="474">the signed permit</text>
  <text class="lb" x="250" y="496">— four lines</text>
  <text class="lb" x="250" y="518" fill="#8f1d14">once, when she lends it</text>

  <path d="M394 620 L430 620 L430 540 L504 540" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <circle cx="430" cy="588" r="17" fill="#1b1630"/><text class="num" x="430" y="594" text-anchor="middle">2</text>

  <path d="M1194 645 L1306 645" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M1306 672 L1194 672" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <circle cx="1250" cy="604" r="17" fill="#1b1630"/><text class="num" x="1250" y="610" text-anchor="middle">3</text>

  <path d="M506 760 L462 760 L462 308 L394 308" stroke="#f2600c" stroke-width="2.5" fill="none" marker-end="url(#af)"/>
  <circle cx="462" cy="700" r="17" fill="#f2600c"/><text class="num" x="462" y="706" text-anchor="middle">4</text>
  <text class="lb" x="438" y="745" text-anchor="end" fill="#8f1d14">wake her — she signs this one action</text>

  <path d="M394 855 L440 855 L440 980 L504 980" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <circle cx="440" cy="920" r="17" fill="#1b1630"/><text class="num" x="440" y="926" text-anchor="middle">5</text>

  <path d="M1194 985 L1306 985" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <circle cx="1250" cy="985" r="17" fill="#1b1630"/><text class="num" x="1250" y="991" text-anchor="middle">6</text>

  <path d="M1194 1112 L1306 1112" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <circle cx="1250" cy="1112" r="17" fill="#1b1630"/><text class="num" x="1250" y="1118" text-anchor="middle">7</text>

  <path d="M506 1080 L394 1080" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <circle cx="450" cy="1080" r="17" fill="#1b1630"/><text class="num" x="450" y="1086" text-anchor="middle">8</text>

  <!-- afterwards -->
  <rect x="40" y="1240" width="1600" height="140" rx="18" fill="#fffdf8" stroke="#1b1630" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text class="h" x="64" y="1282">AFTERWARDS — how a flame is lit</text>
  <text class="t" x="64" y="1320">she used it at least once</text>
  <text class="st" x="400" y="1320">→</text>
  <text class="t" x="440" y="1320">the same permit proves the key was hers</text>
  <text class="st" x="900" y="1320">→</text>
  <text class="t" x="940" y="1320">World ID — one person, once</text>
  <text class="st" x="1270" y="1320">→</text>
  <text class="t" x="1310" y="1320">a flame on that version</text>
  <text class="t" x="64" y="1352">It goes out when the code changes, and the holder's address is never written into it.</text>
</svg>
