<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" width="1680" height="1180" font-family="Figtree, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1b1630"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f2600c"/></marker>
  </defs>
  <style>
    .card{fill:#fff;stroke:#1b1630;stroke-width:2.5}
    .h{font-size:21px;font-weight:600;fill:#1b1630}
    .k{font-size:14px;font-weight:600;letter-spacing:.08em;fill:#8b8498}
    .t{font-size:17px;fill:#4a4357}
    .m{font-size:16px;fill:#4a4357}
    .key{font-size:16px;fill:#8f1d14;font-weight:600}
    .ttl{font-size:30px;font-weight:600;fill:#1b1630}
    .sub{font-size:19px;fill:#6b6478}
    .num{font-size:16px;font-weight:600;fill:#fff}
    .lab{font-size:16px;fill:#1b1630}
    .note{font-size:15px;fill:#8f1d14}
</style>
  <rect width="1680" height="1180" fill="#F3EEE6"/>

<text class="ttl" x="60" y="54">One outbound call, end to end</text>
<text class="sub" x="60" y="88">Read down. Each refusal is a terminal answer — nothing is held open while it waits.</text>
<rect class="card" x="10" y="150" width="260" height="62" rx="14" fill="#fffdf8"/>
<text class="k" x="140" y="188" text-anchor="middle">THE TOOL</text>
<path d="M140 212 L140 1130" stroke="#b9b3a6" stroke-width="2" stroke-dasharray="6 7"/>
<rect class="card" x="340" y="150" width="260" height="62" rx="14" fill="#fffdf8"/>
<text class="k" x="470" y="188" text-anchor="middle">TOMOSHIBI</text>
<path d="M470 212 L470 1130" stroke="#b9b3a6" stroke-width="2" stroke-dasharray="6 7"/>
<rect class="card" x="690" y="150" width="260" height="62" rx="14" fill="#fffdf8"/>
<text class="k" x="820" y="188" text-anchor="middle">0G PRIVATE COMPUTER</text>
<path d="M820 212 L820 1130" stroke="#b9b3a6" stroke-width="2" stroke-dasharray="6 7"/>
<rect class="card" x="1010" y="150" width="260" height="62" rx="14" fill="#fffdf8"/>
<text class="k" x="1140" y="188" text-anchor="middle">THE LEDGER</text>
<path d="M1140 212 L1140 1130" stroke="#b9b3a6" stroke-width="2" stroke-dasharray="6 7"/>
<rect class="card" x="1350" y="150" width="260" height="62" rx="14" fill="#fffdf8"/>
<text class="k" x="1480" y="188" text-anchor="middle">THE REAL SERVICE</text>
<path d="M1480 212 L1480 1130" stroke="#b9b3a6" stroke-width="2" stroke-dasharray="6 7"/>
<path d="M140 262 L460 262" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="80" cy="262" r="15" fill="#1b1630"/><text class="num" x="80" y="267" text-anchor="middle">1</text>
<text class="t" x="305.0" y="250" text-anchor="middle">POST /use — the label, and what it wants to do</text>
<path d="M470 310 L540 310 L540 342 L476 342" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<circle cx="80" cy="324" r="15" fill="#1b1630"/><text class="num" x="80" y="329" text-anchor="middle">2</text>
<text class="t" x="556" y="312" text-anchor="start">look up the row · check the range</text>
<text class="note" x="556" y="358" text-anchor="start">no row, or outside it → DENIED, recorded. 0G is never asked</text>
<path d="M470 400 L810 400" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="80" cy="400" r="15" fill="#1b1630"/><text class="num" x="80" y="405" text-anchor="middle">3</text>
<text class="t" x="645.0" y="388" text-anchor="middle">the four lines + the body of the request</text>
<path d="M820 462 L480 462" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="80" cy="462" r="15" fill="#1b1630"/><text class="num" x="80" y="467" text-anchor="middle">4</text>
<text class="t" x="645.0" y="450" text-anchor="middle">routine · significant · decisive</text>
<text class="note" x="645.0" y="484" text-anchor="middle">no answer → STOPPED. There is no fallback judgement</text>
<path d="M470 538 L150 538" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="80" cy="538" r="15" fill="#1b1630"/><text class="num" x="80" y="543" text-anchor="middle">5</text>
<text class="t" x="305.0" y="526" text-anchor="middle">NEEDS_PRESS — come back with a signature for this one call</text>
<text class="note" x="305.0" y="560" text-anchor="middle">only when it came back heavy</text>
<path d="M140 614 L1130 614" stroke="#f2600c" stroke-width="2.5" marker-end="url(#af)"/>
<circle cx="80" cy="614" r="15" fill="#1b1630"/><text class="num" x="80" y="619" text-anchor="middle">6</text>
<text class="t" x="640.0" y="602" text-anchor="middle">over 127.0.0.1 — the four lines</text>
<text class="note" x="640.0" y="636" text-anchor="middle">TOMOSHIBI cannot reach the device. The tool carries it</text>
<path d="M1140 690 L150 690" stroke="#f2600c" stroke-width="2.5" marker-end="url(#af)"/>
<circle cx="80" cy="690" r="15" fill="#1b1630"/><text class="num" x="80" y="695" text-anchor="middle">7</text>
<text class="t" x="640.0" y="678" text-anchor="middle">the signature, after a long press</text>
<text class="note" x="640.0" y="712" text-anchor="middle">or she does not press, and it simply never happens</text>
<path d="M140 766 L460 766" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="80" cy="766" r="15" fill="#1b1630"/><text class="num" x="80" y="771" text-anchor="middle">8</text>
<text class="t" x="305.0" y="754" text-anchor="middle">the same request again, on a permit good for one call</text>
<text class="note" x="305.0" y="788" text-anchor="middle">every check runs again, 0G included</text>
<path d="M470 828 L540 828 L540 860 L476 860" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<circle cx="80" cy="842" r="15" fill="#1b1630"/><text class="num" x="80" y="847" text-anchor="middle">9</text>
<text class="t" x="556" y="830" text-anchor="start">reserve one call of the count</text>
<text class="note" x="556" y="876" text-anchor="start">nothing left → DENIED · EXHAUSTED</text>
<path d="M470 918 L1470 918" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="80" cy="918" r="15" fill="#1b1630"/><text class="num" x="80" y="923" text-anchor="middle">10</text>
<text class="t" x="975.0" y="906" text-anchor="middle">the label is swapped for the key — here, and only here</text>
<path d="M1480 980 L480 980" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="80" cy="980" r="15" fill="#1b1630"/><text class="num" x="80" y="985" text-anchor="middle">11</text>
<text class="t" x="975.0" y="968" text-anchor="middle">the result</text>
<path d="M470 1042 L150 1042" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="80" cy="1042" r="15" fill="#1b1630"/><text class="num" x="80" y="1047" text-anchor="middle">12</text>
<text class="t" x="305.0" y="1030" text-anchor="middle">the result, and a hash of it. Never the key</text>
<path d="M470 1090 L540 1090 L540 1122 L476 1122" stroke="#1b1630" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<circle cx="80" cy="1104" r="15" fill="#1b1630"/><text class="num" x="80" y="1109" text-anchor="middle">13</text>
<text class="t" x="556" y="1092" text-anchor="start">append to the trail → 0G Storage</text>
<text class="note" x="556" y="1138" text-anchor="start">allowed and refused, in the same place</text>
</svg>