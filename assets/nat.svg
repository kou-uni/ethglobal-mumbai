<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1180" width="1680" height="1180" font-family="Figtree, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1b1630"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#f2600c"/></marker>
  </defs>
  <style>
    .card{fill:#fff;stroke:#1b1630;stroke-width:2.5}
    .h{font-size:21px;font-weight:600;fill:#1b1630}
    .k{font-size:14px;font-weight:600;letter-spacing:.08em;fill:#8b8498}
    .t{font-size:17px;fill:#4a4357}
    .m{font-size:16px;fill:#4a4357}
    .key{font-size:16px;fill:#8f1d14;font-weight:600}
    .ttl{font-size:30px;font-weight:600;fill:#1b1630}
    .sub{font-size:19px;fill:#6b6478}
    .num{font-size:16px;font-weight:600;fill:#fff}
    .lab{font-size:16px;fill:#1b1630}
    .note{font-size:15px;fill:#8f1d14}
</style>
  <rect width="1680" height="1180" fill="#F3EEE6"/>

<text class="ttl" x="60" y="54">TOMOSHIBI — the switchboard between your agents and your keys</text>
<text class="sub" x="60" y="88">Your tools call by label. TOMOSHIBI puts the call through to the real service — or puts it to you first, when it is heavy.</text>
<rect x="390" y="108" width="750" height="84" rx="16" fill="#FFF4EA" stroke="#f2600c" stroke-width="2.5"/>
<text class="k" x="414" y="138" fill="#c2410c">THE LEDGER · plugged into the same laptop</text>
<text class="m" x="414" y="172">hardware, in your hand — not in the laptop, and not in the cloud</text>
<path d="M765 192 L765 246" stroke="#f2600c" stroke-width="2.5" marker-end="url(#af)"/>
<rect x="40" y="200" width="1120" height="545" rx="22" fill="#fffdf8" stroke="#1b1630" stroke-width="2.5" stroke-dasharray="10 8"/>
<text class="k" x="64" y="234">INSIDE THIS LAPTOP</text>
<rect class="card" x="64" y="290" width="300" height="84" rx="14"/>
<text class="h" x="86" y="324">Claude Code, on this PC</text>
<text class="m" x="86" y="354">calls: model-main</text>
<path d="M364 332 L386 332" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="64" y="394" width="300" height="84" rx="14"/>
<text class="h" x="86" y="428">the tool you are building</text>
<text class="m" x="86" y="458">calls: stripe-live</text>
<path d="M364 436 L386 436" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="64" y="498" width="300" height="84" rx="14"/>
<text class="h" x="86" y="532">a tool you handed out</text>
<text class="m" x="86" y="562">calls: resend-tx</text>
<path d="M364 540 L386 540" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="390" y="250" width="750" height="470" rx="18"/>
<text class="h" x="414" y="288">TOMOSHIBI · the switchboard, on the laptop</text>
<text class="m" x="414" y="316">two parts: the page you look at, and the broker that holds this table</text>
<text class="k" x="414" y="360">LABEL</text>
<text class="k" x="560" y="360">WHAT IT MAY DO</text>
<text class="k" x="1010" y="360">THE REAL KEY</text>
<path d="M414 374 L1116 374" stroke="#d8d2c6" stroke-width="2"/>
<text class="lab" x="414" y="412">model-main</text>
<text class="m" x="560" y="412">api.anthropic.com · POST /v1/messages · 2,000 calls</text>
<text class="key" x="1010" y="412">sk-ant-••••</text>
<text class="lab" x="414" y="464">stripe-live</text>
<text class="m" x="560" y="464">api.stripe.com · * /v1 · 20 calls · 7 days</text>
<text class="key" x="1010" y="464">sk_live_••••</text>
<text class="lab" x="414" y="516">resend-tx</text>
<text class="m" x="560" y="516">api.resend.com · POST /emails · 50 calls</text>
<text class="key" x="1010" y="516">re_••••</text>
<path d="M980 386 L980 588" stroke="#8f1d14" stroke-width="2.5" stroke-dasharray="7 6"/>
<text class="note" x="414" y="620">The right column is never printed, never logged, and never returned to a tool.</text>
<text class="m" x="414" y="672">What leaves this laptop: the request itself, its weight, and the trail. Never the right column.</text>
<text class="k" x="1200" y="234">OUTSIDE · OVER THE NETWORK</text>
<rect class="card" x="1200" y="250" width="440" height="112" rx="14" style="fill:#fffdf8"/>
<text class="k" x="1222" y="282">0G PRIVATE COMPUTER</text>
<text class="m" x="1222" y="312">weighs every request before it runs:</text>
<text class="m" x="1222" y="336">routine · significant · decisive.</text>
<text class="m" x="1222" y="360">Its operator cannot read the body</text>
<path d="M1146 306 L1196 306" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
<rect class="card" x="1200" y="372" width="440" height="112" rx="14" style="fill:#fffdf8"/>
<text class="k" x="1222" y="404">0G STORAGE</text>
<text class="m" x="1222" y="434">where the trail is sealed — the lineage</text>
<text class="m" x="1222" y="458">of one version of one tool</text>
<path d="M1146 428 L1196 428" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="1200" y="494" width="440" height="112" rx="14" style="fill:#fffdf8"/>
<text class="k" x="1222" y="526">WORLD ID</text>
<text class="m" x="1222" y="556">one person, once. The only way a star</text>
<text class="m" x="1222" y="580">is lit, and the holder's address is</text>
<text class="m" x="1222" y="604">never written into it</text>
<path d="M1146 550 L1196 550" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="1200" y="616" width="440" height="112" rx="14" style="fill:#fffdf8"/>
<text class="k" x="1222" y="648">THE REAL SERVICES</text>
<text class="m" x="1222" y="678">api.anthropic.com · api.stripe.com</text>
<text class="m" x="1222" y="702">api.resend.com</text>
<path d="M1146 672 L1196 672" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<text class="k" x="60" y="790">If you know NAT, it is that</text>
<rect class="card" x="60" y="810" width="860" height="314" rx="16"/>
<text class="k" x="84" y="844">NAT</text>
<text class="k" x="470" y="844">TOMOSHIBI</text>
<path d="M84 858 L896 858" stroke="#d8d2c6" stroke-width="2"/>
<text class="m" x="84" y="890">a private address, 10.x</text>
<text class="m" x="470" y="890">a label — meaningless anywhere else</text>
<text class="m" x="84" y="923">the public address</text>
<text class="m" x="470" y="923">the real API key</text>
<text class="m" x="84" y="956">the NAT box</text>
<text class="m" x="470" y="956">the Broker, on the laptop</text>
<text class="m" x="84" y="989">the translation table</text>
<text class="m" x="470" y="989">label → range → secret</text>
<text class="m" x="84" y="1022">the firewall rules</text>
<text class="m" x="470" y="1022">the signed permit: target, operation, count, expiry</text>
<text class="m" x="84" y="1055">nothing gets in by itself</text>
<text class="m" x="470" y="1055">no label works without a signature that is still good</text>
<text class="m" x="84" y="1088">the administrator</text>
<text class="m" x="470" y="1088">the Ledger. Not a password, and not the agent</text>
<text class="k" x="960" y="790">Who it is for</text>
<rect x="960" y="810" width="680" height="314" rx="16" fill="#fffdf8" stroke="#1b1630" stroke-width="2.5" stroke-dasharray="8 7"/>
<text class="t" x="984" y="852">You build with Claude Code on this laptop. Shipping anything means</text>
<text class="t" x="984" y="886">collecting keys first — the model API itself, Stripe, mail — and the</text>
<text class="t" x="984" y="920">pile grows as you go. Hand a tool to someone and you are carrying</text>
<text class="t" x="984" y="954">their usage on your key. TOMOSHIBI is where those keys live: every</text>
<text class="t" x="984" y="988">tool is given a label, each label keeps a history, and only the heavy</text>
<text class="t" x="984" y="1022">calls reach your hand.</text>
</svg>